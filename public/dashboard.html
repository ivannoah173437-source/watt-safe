<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WattSafe - Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #F0F2F5;
            transition: background 0.3s ease;
            padding: 16px;
        }

        body.dark-mode {
            background: #0A0A0A !important;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #FFFFFF;
            border-radius: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            padding: 24px 20px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            max-height: 750px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode .container {
            background: #14141E;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* ============================================
           HEADER - LOGO
           ============================================ */
        .header-logo {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-logo .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
            color: #1A1A2E;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-logo .logo {
            color: #FFFFFF;
        }

        .header-logo .logo .icon {
            font-size: 26px;
        }

        .header-logo .logo span {
            color: #3074F9;
        }

        /* ============================================
           HEADER - SALUTATION + THEME
           ============================================ */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .header-row .greeting .name {
            font-size: 17px;
            font-weight: 700;
            color: #1A1A2E;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-row .greeting .name {
            color: #FFFFFF;
        }

        .header-row .greeting .sub {
            font-size: 12px;
            color: #6B7A8F;
            margin-top: 1px;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-row .greeting .sub {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-theme {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #E8EDF5;
            background: #FFFFFF;
            color: #1A1A2E;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-family: inherit;
        }

        body.dark-mode .btn-theme {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        .btn-theme:hover {
            background: #F5F7FA;
            transform: scale(1.05);
        }

        body.dark-mode .btn-theme:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-theme:active {
            transform: scale(0.92);
        }

        /* ============================================
           CARTES INFO
           ============================================ */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .info-card {
            background: #FAFBFC;
            border-radius: 14px;
            padding: 14px 10px;
            border: 1px solid #E8EDF5;
            text-align: center;
            transition: all 0.2s ease;
        }

        body.dark-mode .info-card {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .info-card:hover {
            border-color: #3074F9;
        }

        body.dark-mode .info-card:hover {
            border-color: rgba(48, 116, 249, 0.4);
        }

        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #6B7A8F;
            letter-spacing: 0.5px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        body.dark-mode .info-card .label {
            color: rgba(255, 255, 255, 0.3);
        }

        .info-card .value {
            font-size: 18px;
            font-weight: 700;
            color: #1A1A2E;
            margin-top: 3px;
            transition: color 0.3s ease;
        }

        body.dark-mode .info-card .value {
            color: #FFFFFF;
        }

        .info-card .value.alert {
            color: #F59E0B;
        }
        .info-card .value.danger {
            color: #EF4444;
        }
        .info-card .value.success {
            color: #10B981;
        }

        body.dark-mode .info-card .value.alert {
            color: #F59E0B;
        }
        body.dark-mode .info-card .value.danger {
            color: #EF4444;
        }
        body.dark-mode .info-card .value.success {
            color: #10B981;
        }

        /* ============================================
           JAUGE CIRCULAIRE
           ============================================ */
        .gauge-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 8px 0;
            flex-shrink: 0;
        }

        .gauge-container {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .gauge-container svg {
            transform: rotate(-90deg);
        }

        .gauge-container .bg-circle {
            fill: none;
            stroke: #E8EDF5;
            stroke-width: 12;
            transition: stroke 0.3s ease;
        }

        body.dark-mode .gauge-container .bg-circle {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .gauge-container .progress-circle {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease, stroke 0.3s ease;
        }

        .gauge-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .gauge-container .center-text .value {
            font-size: 26px;
            font-weight: 800;
            color: #1A1A2E;
            display: block;
            line-height: 1;
            transition: color 0.3s ease;
        }

        body.dark-mode .gauge-container .center-text .value {
            color: #FFFFFF;
        }

        .gauge-container .center-text .status {
            font-size: 13px;
            font-weight: 600;
            color: #6B7A8F;
            display: block;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        body.dark-mode .gauge-container .center-text .status {
            color: rgba(255, 255, 255, 0.5);
        }

        .gauge-container .center-text .status.good {
            color: #10B981;
        }
        .gauge-container .center-text .status.medium {
            color: #F59E0B;
        }
        .gauge-container .center-text .status.critical {
            color: #EF4444;
        }
        .gauge-container .center-text .status.empty {
            color: #B0B8C8;
        }

        .gauge-message {
            text-align: center;
            font-size: 12px;
            color: #6B7A8F;
            margin-top: 4px;
            min-height: 18px;
            padding: 0 10px;
        }

        .gauge-message i {
            margin-right: 5px;
            color: #3074F9;
        }

        body.dark-mode .gauge-message {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ============================================
           MONTANT + BOUTON RECHARGER
           ============================================ */
        .recharge-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .recharge-row input {
            flex: 1;
            padding: 12px 14px;
            border: 1.5px solid #E8EDF5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            background: #FAFBFC;
            transition: border-color 0.2s ease;
            min-width: 0;
        }

        .recharge-row input:focus {
            border-color: #3074F9;
            background: #FFFFFF;
        }

        .recharge-row input::placeholder {
            font-size: 13px;
        }

        body.dark-mode .recharge-row input {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
            color: #FFFFFF;
        }

        body.dark-mode .recharge-row input:focus {
            border-color: #3074F9;
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-recharge {
            flex: 1;
            padding: 12px;
            background: #1A1A2E;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0;
            white-space: nowrap;
        }

        body.dark-mode .btn-recharge {
            background: #3074F9;
        }

        .btn-recharge:hover {
            background: #2A2A4E;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 26, 46, 0.2);
        }

        body.dark-mode .btn-recharge:hover {
            background: #1A5CDB;
            box-shadow: 0 4px 20px rgba(48, 116, 249, 0.3);
        }

        .btn-recharge:active {
            transform: scale(0.98);
        }

        .btn-recharge:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-recharge i {
            font-size: 16px;
        }

        /* ============================================
           TOAST MESSAGE
           ============================================ */
        .toast {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
            animation: slideDown 0.3s ease;
        }

        .toast.success {
            display: block;
            background: #D1FAE5;
            color: #10B981;
            border: 1px solid #A7F3D0;
        }

        .toast.error {
            display: block;
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FCA5A5;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.dark-mode .toast.success {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border-color: rgba(16, 185, 129, 0.2);
        }

        body.dark-mode .toast.error {
            background: rgba(220, 38, 38, 0.15);
            color: #F87171;
            border-color: rgba(220, 38, 38, 0.2);
        }

        /* ============================================
           NAVBAR AVEC POINT ROUGE
           ============================================ */
        .navbar {
            background: #1A1A2E;
            border-radius: 18px;
            display: flex;
            justify-content: space-around;
            padding: 10px 6px 8px 6px;
            margin-top: 14px;
            flex-shrink: 0;
            width: 100%;
            transition: background 0.3s ease;
        }

        body.dark-mode .navbar {
            background: #0A0A12;
        }

        .navbar .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 3px 8px;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
            border-radius: 10px;
            position: relative;
        }

        .navbar .nav-item i {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .navbar .nav-item:hover {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .navbar .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .navbar .nav-item:hover i {
            color: rgba(255, 255, 255, 0.7);
        }

        .navbar .nav-item.active {
            color: #FFFFFF;
        }

        .navbar .nav-item.active i {
            color: #FFFFFF;
        }

        .navbar .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item .badge-dot {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: #EF4444;
            border-radius: 50%;
            border: 2px solid #1A1A2E;
            display: none;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .nav-item .badge-dot.active {
            display: block;
        }

        body.dark-mode .nav-item .badge-dot {
            border-color: #0A0A12;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (min-width: 600px) {
            .container {
                max-width: 440px;
                padding: 28px 24px 20px 24px;
                min-height: 70vh;
                max-height: 720px;
                border-radius: 32px;
            }

            .header-logo .logo {
                font-size: 24px;
            }
            .header-logo .logo .icon {
                font-size: 28px;
            }
            .header-row .greeting .name {
                font-size: 18px;
            }
            .gauge-container {
                width: 180px;
                height: 180px;
            }
            .gauge-container .center-text .value {
                font-size: 28px;
            }
            .info-card .value {
                font-size: 19px;
            }
            .btn-recharge {
                font-size: 16px;
                padding: 14px;
            }
            .navbar .nav-item {
                font-size: 10px;
            }
            .navbar .nav-item i {
                font-size: 20px;
            }
            .nav-item .badge-dot {
                width: 11px;
                height: 11px;
                top: -3px;
                right: -5px;
            }
        }

        @media (min-width: 901px) {
            body {
                padding: 32px;
            }
            .container {
                max-width: 520px;
                padding: 32px 28px 24px 28px;
                min-height: 65vh;
                max-height: 780px;
                border-radius: 36px;
            }
            .header-logo .logo {
                font-size: 26px;
            }
            .header-logo .logo .icon {
                font-size: 30px;
            }
            .header-row .greeting .name {
                font-size: 20px;
            }
            .gauge-container {
                width: 200px;
                height: 200px;
            }
            .gauge-container .center-text .value {
                font-size: 32px;
            }
            .info-card .value {
                font-size: 22px;
            }
            .btn-recharge {
                font-size: 17px;
                padding: 16px;
            }
            .navbar .nav-item {
                font-size: 11px;
            }
            .navbar .nav-item i {
                font-size: 22px;
            }
            .gauge-message {
                font-size: 14px;
            }
            .nav-item .badge-dot {
                width: 12px;
                height: 12px;
                top: -3px;
                right: -6px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 16px 12px 12px 12px;
                border-radius: 20px;
                min-height: 92vh;
                max-height: none;
            }
            .header-logo .logo {
                font-size: 18px;
            }
            .header-logo .logo .icon {
                font-size: 20px;
            }
            .header-row .greeting .name {
                font-size: 15px;
            }
            .header-row .greeting .sub {
                font-size: 11px;
            }
            .btn-theme {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }
            .gauge-container {
                width: 130px;
                height: 130px;
            }
            .gauge-container .center-text .value {
                font-size: 20px;
            }
            .gauge-container .center-text .status {
                font-size: 11px;
            }
            .info-grid {
                gap: 8px;
            }
            .info-card {
                padding: 10px 8px;
                border-radius: 10px;
            }
            .info-card .value {
                font-size: 15px;
            }
            .info-card .label {
                font-size: 9px;
            }
            .recharge-row input {
                padding: 10px 10px;
                font-size: 13px;
                border-radius: 10px;
            }
            .btn-recharge {
                padding: 10px 10px;
                font-size: 13px;
                border-radius: 10px;
            }
            .btn-recharge i {
                font-size: 14px;
            }
            .navbar {
                padding: 8px 4px 6px 4px;
                border-radius: 14px;
                margin-top: 10px;
            }
            .navbar .nav-item {
                font-size: 8px;
                padding: 2px 4px;
            }
            .navbar .nav-item i {
                font-size: 16px;
            }
            .gauge-message {
                font-size: 11px;
            }
            .toast {
                font-size: 12px;
                padding: 8px 12px;
            }
            .nav-item .badge-dot {
                width: 8px;
                height: 8px;
                top: -1px;
                right: -3px;
                border-width: 1.5px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- ===== LOGO CENTRÉ ===== -->
        <div class="header-logo">
            <div class="logo">
                <span class="icon">⚡</span>
                Watt<span>Safe</span>
            </div>
        </div>

        <!-- ===== SALUTATION + THEME ===== -->
        <div class="header-row">
            <div class="greeting">
                <div class="name" id="userName">Bienvenue 👋</div>
                <div class="sub" id="userSub">Compteur prépayé</div>
            </div>
            <button class="btn-theme" id="themeToggle" aria-label="Changer le thème">
                ☀
            </button>
        </div>

        <!-- ===== CARTES INFO ===== -->
        <div class="info-grid">
            <div class="info-card">
                <div class="label">🔔 ALERTE</div>
                <div class="value" id="alertDisplay">--</div>
            </div>
            <div class="info-card">
                <div class="label">📅 ÉCHÉANCE</div>
                <div class="value" id="echeanceDisplay">--/--/----</div>
            </div>
        </div>

        <!-- ===== JAUGE CIRCULAIRE ===== -->
        <div class="gauge-wrapper">
            <div class="gauge-container">
                <svg width="100%" height="100%" viewBox="0 0 120 120">
                    <circle class="bg-circle" cx="60" cy="60" r="50" />
                    <circle class="progress-circle" id="progressCircle" cx="60" cy="60" r="50"
                        stroke="#E8EDF5"
                        stroke-dasharray="314.16"
                        stroke-dashoffset="314.16" />
                </svg>
                <div class="center-text">
                    <span class="value" id="gaugeValue">0%</span>
                    <span class="status empty" id="gaugeStatus">En attente</span>
                </div>
            </div>
            <div class="gauge-message" id="gaugeMessage">
                <i class="fas fa-lightbulb"></i> Faites votre première simulation de recharge
            </div>
        </div>

        <!-- ===== TOAST MESSAGE ===== -->
        <div class="toast" id="toastMessage"></div>

        <!-- ===== MONTANT + BOUTON RECHARGER ===== -->
        <div style="flex-shrink: 0;">
            <div class="recharge-row">
                <input type="number" id="rechargeAmount" placeholder="Montant (FCFA)" min="100">
                <button class="btn-recharge" id="btnRecharge">
                    <i class="fas fa-bolt"></i> RECHARGER
                </button>
            </div>
        </div>

        <!-- ===== NAVBAR AVEC POINT ROUGE ===== -->
        <div class="navbar">
            <button class="nav-item active" data-page="accueil">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </button>
            <button class="nav-item" data-page="alerte" style="position:relative;">
                <i class="fa-regular fa-bell"></i>
                <span class="badge-dot" id="alertDot"></span>
                <span>Alerte</span>
            </button>
            <button class="nav-item" data-page="historique">
                <i class="fa-solid fa-chart-column"></i>
                <span>Historique</span>
            </button>
            <button class="nav-item" data-page="profil">
                <i class="fa-regular fa-user"></i>
                <span>Profil</span>
            </button>
        </div>

    </div>

    <script>
        // ============================================
        // 1. UTILISATEUR
        // ============================================
        const user = JSON.parse(localStorage.getItem('wattSafeUser'));
        if (!user) {
            window.location.href = 'historique-saisie.html';
        }
        document.getElementById('userName').textContent = `Bienvenue 👋 ${user.name || 'Utilisateur'}`;

        // ============================================
        // 2. FONCTIONS
        // ============================================
        function calculerMoyennePonderee(recharges) {
            if (recharges.length === 0) return null;
            let sommeScores = 0,
                sommeConsoScore = 0;
            recharges.forEach((r, i) => {
                const conso = r.montant / r.duree;
                const score = r.duree * (i + 1);
                sommeConsoScore += conso * score;
                sommeScores += score;
            });
            return sommeConsoScore / sommeScores;
        }

        // ============================================
        // 3. METTRE À JOUR LE DASHBOARD + ALERTE
        // ============================================
        function mettreAJourDashboard() {
            const recharges = JSON.parse(localStorage.getItem('wattSafeRecharges')) || [];
            const currentBalance = parseInt(localStorage.getItem('wattSafeBalance')) || 0;
            const alertDelay = parseInt(localStorage.getItem('wattSafeAlertDelay')) || 3;
            
            const moyenne = calculerMoyennePonderee(recharges);
            
            const alertDisplay = document.getElementById('alertDisplay');
            const echeanceDisplay = document.getElementById('echeanceDisplay');
            const gaugeValue = document.getElementById('gaugeValue');
            const gaugeStatus = document.getElementById('gaugeStatus');
            const progressCircle = document.getElementById('progressCircle');
            const gaugeMessage = document.getElementById('gaugeMessage');
            const dot = document.getElementById('alertDot');
            
            const circumference = 2 * Math.PI * 50;
            
            // === GÉRER LE POINT ROUGE ===
            if (moyenne && currentBalance > 0) {
                const joursRestants = Math.floor(currentBalance / moyenne);
                if (joursRestants <= alertDelay) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            } else {
                dot.classList.remove('active');
            }
            
            // === GÉRER LA JAUGE ===
            if (currentBalance === 0 || !moyenne) {
                progressCircle.style.stroke = '#E8EDF5';
                progressCircle.style.strokeDashoffset = circumference;
                gaugeValue.textContent = '0%';
                gaugeStatus.textContent = 'En attente';
                gaugeStatus.className = 'status empty';
                alertDisplay.textContent = '--';
                alertDisplay.className = 'value';
                echeanceDisplay.textContent = '--/--/----';
                gaugeMessage.innerHTML = '<i class="fas fa-lightbulb"></i> Faites votre première simulation de recharge';
                return;
            }
            
            // Calcul des jours restants
            const joursRestants = Math.floor(currentBalance / moyenne);
            
            // Mettre à jour l'affichage
            const now = new Date();
            const echeance = new Date(now);
            echeance.setDate(echeance.getDate() + joursRestants);
            
            alertDisplay.textContent = `Dans ${joursRestants} jours`;
            alertDisplay.className = 'value ' + (joursRestants <= 3 ? 'danger' : joursRestants <= 7 ? 'alert' : 'success');
            
            echeanceDisplay.textContent = echeance.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
            
            const niveau = Math.min(100, Math.max(0, (joursRestants / 30) * 100));
            progressCircle.style.strokeDashoffset = circumference - (niveau / 100) * circumference;
            
            let color, statusText, statusClass;
            if (niveau >= 60) {
                color = '#10B981';
                statusText = 'Bon';
                statusClass = 'good';
            } else if (niveau >= 30) {
                color = '#F59E0B';
                statusText = 'Moyen';
                statusClass = 'medium';
            } else {
                color = '#EF4444';
                statusText = 'Critique';
                statusClass = 'critical';
            }
            
            progressCircle.style.stroke = color;
            gaugeValue.textContent = `${Math.round(niveau)}%`;
            gaugeStatus.textContent = statusText;
            gaugeStatus.className = `status ${statusClass}`;
            
            // Message personnalisé
            let message = '';
            if (niveau >= 60) message = '✅ Vous êtes tranquille, pensez à recharger dans quelques jours.';
            else if (niveau >= 30) message = '⚡ Pensez à recharger bientôt.';
            else message = '🚨 Alerte ! Rechargez dès que possible.';
            gaugeMessage.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
        }

        // ============================================
        // 4. AFFICHER UN MESSAGE TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 4000);
        }

        // ============================================
        // 5. CHARGEMENT INITIAL
        // ============================================
        if (localStorage.getItem('wattSafeBalance') === null) {
            localStorage.setItem('wattSafeBalance', '0');
        }
        
        mettreAJourDashboard();

        // ============================================
        // 6. THEME
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☾';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☾' : '☀';
            localStorage.setItem('dashboardTheme', isDark ? 'dark' : 'light');
        });

        // ============================================
        // 7. BOUTON RECHARGER (SIMULATION)
        // ============================================
        document.getElementById('btnRecharge').addEventListener('click', function() {
            const amountInput = document.getElementById('rechargeAmount');
            const montant = parseInt(amountInput.value);

            if (!montant || montant < 100) {
                showToast('⚠️ Entrez un montant valide (minimum 100 FCFA)', 'error');
                amountInput.focus();
                return;
            }

            this.disabled = true;
            this.innerHTML = '⏳ Traitement...';

            try {
                let balance = parseInt(localStorage.getItem('wattSafeBalance')) || 0;
                balance += montant;
                localStorage.setItem('wattSafeBalance', balance);

                const historique = JSON.parse(localStorage.getItem('wattSafeHistorique')) || [];
                const dureeEstimee = Math.max(1, Math.floor(montant / 200));
                historique.push({
                    montant: montant,
                    date: new Date().toISOString(),
                    duree: dureeEstimee
                });
                localStorage.setItem('wattSafeHistorique', JSON.stringify(historique));

                mettreAJourDashboard();
                showToast(`✅ Recharge simulée de ${montant.toLocaleString()} FCFA !`, 'success');

            } catch (error) {
                console.error('❌ Erreur:', error);
                showToast('⚠️ Erreur lors de la simulation', 'error');
            } finally {
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-bolt"></i> RECHARGER';
                document.getElementById('rechargeAmount').value = '';
            }
        });

        // ============================================
        // 8. NAVBAR
        // ============================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const page = item.dataset.page;
                
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                if (page === 'accueil') {
                    window.location.href = '/dashboard.html';
                } else if (page === 'alerte') {
                    window.location.href = '/alerte.html';
                } else if (page === 'historique') {
                    window.location.href = '/historique.html';
                } else if (page === 'profil') {
                    window.location.href = '/profil.html';
                }
            });
        });

        console.log('⚡ Dashboard chargé (mode simulation)');
    </script>

</body>
</html>
