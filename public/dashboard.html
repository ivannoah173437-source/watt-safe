<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WattSafe - Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ============================================
           RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            background: #F0F2F5;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: #0A0A0A !important;
            min-height: 100vh;
            height: 100%;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            padding: 28px 28px 20px 28px;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
            max-height: 760px;
            position: relative;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-mode .container {
            background: #14141E;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* ============================================
           HEADER - LOGO
           ============================================ */
        .header-logo {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        .header-logo .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            color: #1A1A2E;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-logo .logo {
            color: #FFFFFF;
        }

        .header-logo .logo .icon {
            font-size: 30px;
        }

        .header-logo .logo span {
            color: #3074F9;
        }

        /* ============================================
           HEADER - SALUTATION + THEME
           ============================================ */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .header-row .greeting .name {
            font-size: 18px;
            font-weight: 700;
            color: #1A1A2E;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-row .greeting .name {
            color: #FFFFFF;
        }

        .header-row .greeting .sub {
            font-size: 13px;
            color: #6B7A8F;
            margin-top: 1px;
            transition: color 0.3s ease;
        }

        body.dark-mode .header-row .greeting .sub {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-theme {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid #E8EDF5;
            background: #FFFFFF;
            color: #1A1A2E;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-family: inherit;
        }

        body.dark-mode .btn-theme {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        .btn-theme:hover {
            background: #F5F7FA;
            transform: scale(1.05);
        }

        body.dark-mode .btn-theme:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-theme:active {
            transform: scale(0.92);
        }

        /* ============================================
           CARTES INFO
           ============================================ */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .info-card {
            background: #FAFBFC;
            border-radius: 16px;
            padding: 18px 12px;
            border: 1px solid #E8EDF5;
            text-align: center;
            transition: all 0.2s ease;
        }

        body.dark-mode .info-card {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .info-card:hover {
            border-color: #3074F9;
        }

        body.dark-mode .info-card:hover {
            border-color: rgba(48, 116, 249, 0.4);
        }

        .info-card .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #6B7A8F;
            letter-spacing: 0.5px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        body.dark-mode .info-card .label {
            color: rgba(255, 255, 255, 0.3);
        }

        .info-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #1A1A2E;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        body.dark-mode .info-card .value {
            color: #FFFFFF;
        }

        .info-card .value.alert {
            color: #F59E0B;
        }
        .info-card .value.danger {
            color: #EF4444;
        }
        .info-card .value.success {
            color: #10B981;
        }

        body.dark-mode .info-card .value.alert {
            color: #F59E0B;
        }
        body.dark-mode .info-card .value.danger {
            color: #EF4444;
        }
        body.dark-mode .info-card .value.success {
            color: #10B981;
        }

        /* ============================================
           JAUGE CIRCULAIRE
           ============================================ */
        .gauge-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0 16px 0;
            flex-shrink: 0;
        }

        .gauge-container {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .gauge-container svg {
            transform: rotate(-90deg);
        }

        .gauge-container .bg-circle {
            fill: none;
            stroke: #E8EDF5;
            stroke-width: 12;
            transition: stroke 0.3s ease;
        }

        body.dark-mode .gauge-container .bg-circle {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .gauge-container .progress-circle {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease, stroke 0.3s ease;
        }

        .gauge-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .gauge-container .center-text .value {
            font-size: 30px;
            font-weight: 800;
            color: #1A1A2E;
            display: block;
            line-height: 1;
            transition: color 0.3s ease;
        }

        body.dark-mode .gauge-container .center-text .value {
            color: #FFFFFF;
        }

        .gauge-container .center-text .status {
            font-size: 14px;
            font-weight: 600;
            color: #6B7A8F;
            display: block;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        body.dark-mode .gauge-container .center-text .status {
            color: rgba(255, 255, 255, 0.5);
        }

        .gauge-container .center-text .status.good {
            color: #10B981;
        }
        .gauge-container .center-text .status.medium {
            color: #F59E0B;
        }
        .gauge-container .center-text .status.critical {
            color: #EF4444;
        }

        /* ============================================
           BOUTON RECHARGER
           ============================================ */
        .btn-recharge {
            width: 100%;
            padding: 16px;
            background: #1A1A2E;
            border: none;
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-family: inherit;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        body.dark-mode .btn-recharge {
            background: #3074F9;
        }

        .btn-recharge:hover {
            background: #2A2A4E;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 26, 46, 0.2);
        }

        body.dark-mode .btn-recharge:hover {
            background: #1A5CDB;
            box-shadow: 0 4px 20px rgba(48, 116, 249, 0.3);
        }

        .btn-recharge:active {
            transform: scale(0.98);
        }

        .btn-recharge i {
            font-size: 20px;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            background: #1A1A2E;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 12px 8px 10px 8px;
            margin-top: 18px;
            flex-shrink: 0;
            width: 100%;
            transition: background 0.3s ease;
        }

        body.dark-mode .navbar {
            background: #0A0A12;
        }

        .navbar .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 10px;
            text-decoration: none;
            background: none;
            border: none;
            font-family: inherit;
            border-radius: 12px;
        }

        .navbar .nav-item i {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .navbar .nav-item:hover {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .navbar .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .navbar .nav-item:hover i {
            color: rgba(255, 255, 255, 0.7);
        }

        .navbar .nav-item.active {
            color: #FFFFFF;
        }

        .navbar .nav-item.active i {
            color: #FFFFFF;
        }

        .navbar .nav-item:active {
            transform: scale(0.92);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .container {
                max-width: none;
                border-radius: 0;
                min-height: 100vh;
                max-height: none;
                padding: 20px 16px 14px 16px;
            }

            .header-logo .logo {
                font-size: 20px;
            }

            .header-logo .logo .icon {
                font-size: 24px;
            }

            .header-row .greeting .name {
                font-size: 16px;
            }

            .header-row .greeting .sub {
                font-size: 12px;
            }

            .btn-theme {
                width: 34px;
                height: 34px;
                font-size: 13px;
            }

            .gauge-container {
                width: 150px;
                height: 150px;
            }

            .gauge-container .center-text .value {
                font-size: 24px;
            }

            .gauge-container .center-text .status {
                font-size: 12px;
            }

            .info-grid {
                gap: 10px;
            }

            .info-card {
                padding: 14px 10px;
                border-radius: 14px;
            }

            .info-card .value {
                font-size: 17px;
            }

            .btn-recharge {
                font-size: 15px;
                padding: 13px;
                border-radius: 14px;
            }

            .btn-recharge i {
                font-size: 18px;
            }

            .navbar {
                padding: 10px 4px 8px 4px;
                border-radius: 16px;
                margin-top: 14px;
            }

            .navbar .nav-item {
                font-size: 9px;
                padding: 2px 6px;
            }

            .navbar .nav-item i {
                font-size: 18px;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 540px;
                min-height: 72vh;
                max-height: 780px;
                padding: 32px 32px 24px 32px;
                border-radius: 36px;
            }

            .header-logo .logo {
                font-size: 26px;
            }

            .header-logo .logo .icon {
                font-size: 32px;
            }

            .header-row .greeting .name {
                font-size: 20px;
            }

            .gauge-container {
                width: 200px;
                height: 200px;
            }

            .gauge-container .center-text .value {
                font-size: 34px;
            }

            .info-card .value {
                font-size: 22px;
            }

            .btn-recharge {
                font-size: 18px;
                padding: 16px;
            }

            .navbar .nav-item {
                font-size: 11px;
            }

            .navbar .nav-item i {
                font-size: 22px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 580px;
                min-height: 68vh;
                max-height: 800px;
                padding: 36px 36px 28px 36px;
                border-radius: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- ===== LOGO CENTRÉ ===== -->
        <div class="header-logo">
            <div class="logo">
                <span class="icon">⚡</span>
                Watt<span>Safe</span>
            </div>
        </div>

        <!-- ===== SALUTATION + THEME ===== -->
        <div class="header-row">
            <div class="greeting">
                <div class="name" id="userName">Bienvenue 👋</div>
                <div class="sub" id="userSub">Compteur prépayé</div>
            </div>
            <button class="btn-theme" id="themeToggle" aria-label="Changer le thème">
                ☀
            </button>
        </div>

        <!-- ===== CARTES INFO ===== -->
        <div class="info-grid">
            <div class="info-card">
                <div class="label">🔔 ALERTE</div>
                <div class="value alert" id="alertDisplay">Dans 5 jours</div>
            </div>
            <div class="info-card">
                <div class="label">📅 ÉCHÉANCE</div>
                <div class="value" id="echeanceDisplay">15/08/2026</div>
            </div>
        </div>

        <!-- ===== JAUGE CIRCULAIRE ===== -->
        <div class="gauge-wrapper">
            <div class="gauge-container">
                <svg width="100%" height="100%" viewBox="0 0 120 120">
                    <circle class="bg-circle" cx="60" cy="60" r="50" />
                    <circle class="progress-circle" id="progressCircle" cx="60" cy="60" r="50"
                        stroke="#10B981"
                        stroke-dasharray="314.16"
                        stroke-dashoffset="314.16" />
                </svg>
                <div class="center-text">
                    <span class="value" id="gaugeValue">75%</span>
                    <span class="status good" id="gaugeStatus">Bon</span>
                </div>
            </div>
        </div>

        <!-- ===== BOUTON RECHARGER ===== -->
        <button class="btn-recharge" id="btnRecharge">
            <i class="fas fa-bolt"></i> RECHARGER
        </button>

        <!-- ===== NAVBAR ===== -->
        <div class="navbar">
            <button class="nav-item active" data-page="accueil">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </button>
            <button class="nav-item" data-page="alerte">
                <i class="fa-regular fa-bell"></i>
                <span>Alerte</span>
            </button>
            <button class="nav-item" data-page="historique">
                <i class="fa-solid fa-chart-column"></i>
                <span>Historique</span>
            </button>
            <button class="nav-item" data-page="profil">
                <i class="fa-regular fa-user"></i>
                <span>Profil</span>
            </button>
        </div>

    </div>

    <script>
        // ============================================
        // 1. UTILISATEUR
        // ============================================
        const user = JSON.parse(localStorage.getItem('wattSafeUser'));
        if (!user) {
            window.location.href = 'login.html';
        }
        document.getElementById('userName').textContent = `Bienvenue 👋 ${user.name || 'Utilisateur'}`;

        // ============================================
        // 2. DONNÉES
        // ============================================
        const recharges = JSON.parse(localStorage.getItem('wattSafeRecharges')) || [];
        const alertDelay = parseInt(localStorage.getItem('wattSafeAlertDelay')) || 3;

        function calculerMoyennePonderee(recharges) {
            if (recharges.length === 0) return null;
            let sommeScores = 0,
                sommeConsoScore = 0;
            recharges.forEach((r, i) => {
                const conso = r.montant / r.duree;
                const score = r.duree * (i + 1);
                sommeConsoScore += conso * score;
                sommeScores += score;
            });
            return sommeConsoScore / sommeScores;
        }

        const moyenne = calculerMoyennePonderee(recharges);
        const dernierMontant = recharges.length > 0 ? recharges[recharges.length - 1].montant : 5000;
        const dureeEstimee = moyenne ? dernierMontant / moyenne : 30;
        const joursRestants = Math.max(0, Math.floor(dureeEstimee * 0.6));

        // ============================================
        // 3. CARTES
        // ============================================
        const alertDisplay = document.getElementById('alertDisplay');
        const echeanceDisplay = document.getElementById('echeanceDisplay');

        const now = new Date();
        const echeance = new Date(now);
        echeance.setDate(echeance.getDate() + joursRestants);

        alertDisplay.textContent = `Dans ${joursRestants} jours`;
        alertDisplay.className = 'value ' + (joursRestants <= 3 ? 'danger' : joursRestants <= 7 ? 'alert' : 'success');

        echeanceDisplay.textContent = echeance.toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });

        // ============================================
        // 4. JAUGE
        // ============================================
        const progressCircle = document.getElementById('progressCircle');
        const gaugeValue = document.getElementById('gaugeValue');
        const gaugeStatus = document.getElementById('gaugeStatus');

        const circumference = 2 * Math.PI * 50;
        const niveau = Math.min(100, Math.max(0, (joursRestants / 30) * 100));
        progressCircle.style.strokeDashoffset = circumference - (niveau / 100) * circumference;

        let color, statusText, statusClass;
        if (niveau >= 60) {
            color = '#10B981';
            statusText = 'Bon';
            statusClass = 'good';
        } else if (niveau >= 30) {
            color = '#F59E0B';
            statusText = 'Moyen';
            statusClass = 'medium';
        } else {
            color = '#EF4444';
            statusText = 'Critique';
            statusClass = 'critical';
        }

        progressCircle.style.stroke = color;
        gaugeValue.textContent = `${Math.round(niveau)}%`;
        gaugeStatus.textContent = statusText;
        gaugeStatus.className = `status ${statusClass}`;

        // ============================================
        // 5. THEME
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☾';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☾' : '☀';
            localStorage.setItem('dashboardTheme', isDark ? 'dark' : 'light');
        });

        // ============================================
        // 6. BOUTON RECHARGER (appel au backend)
        // ============================================
        document.getElementById('btnRecharge').addEventListener('click', async function() {
            // Désactiver le bouton
            this.disabled = true;
            this.innerHTML = '⏳ Traitement...';

            try {
                const user = JSON.parse(localStorage.getItem('wattSafeUser'));
                const phone = user?.phone || '0700000000';
                const montant = 5000;

                const response = await fetch('/api/payment/initiate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: montant,
                        phone: phone,
                        description: 'Recharge WattSafe'
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    window.location.href = data.payment_url;
                } else {
                    alert('❌ ' + (data.message || 'Erreur de paiement'));
                }

            } catch (error) {
                console.error('❌ Erreur:', error);
                alert('⚠️ Erreur de connexion au serveur. Vérifiez que le serveur est lancé.');
            } finally {
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-bolt"></i> RECHARGER';
            }
        });

        // ============================================
        // 7. NAVBAR
        // ============================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const page = item.dataset.page;
                if (page === 'alerte') {
                    alert('🔔 Page de configuration de l\'alerte');
                } else if (page === 'historique') {
                    alert('📋 Page de l\'historique des recharges');
                } else if (page === 'profil') {
                    alert('👤 Page de votre profil');
                }
            });
        });

        console.log('⚡ Dashboard chargé');
    </script>

</body>
</html>
