<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WattSafe - Saisie des recharges</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        /* ===== HEADER ===== */
        .header-dark {
            background: #1A1A2E;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-dark .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-dark .logo .icon {
            font-size: 20px;
            color: #FFFFFF;
        }

        .header-dark .logo h2 {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .header-dark .logo h2 span {
            color: #3074F9;
        }

        .header-dark .step-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== ZONE DE DÉFILEMENT ===== */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 16px 20px;
            background: #FFFFFF;
        }

        .scroll-area::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-area::-webkit-scrollbar-track {
            background: #F5F5F5;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background: #3074F9;
            border-radius: 4px;
        }

        /* ===== INSTRUCTION ===== */
        .instruction {
            background: #FFF8E1;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #6B7A8F;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instruction i {
            color: #F59E0B;
            font-size: 16px;
        }

        .instruction strong {
            color: #1A1A2E;
        }

        /* ===== SECTION ===== */
        .section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E8EDF5;
            animation: slideUp 0.4s ease;
        }

        .section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #6B7A8F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* ===== GRILLE NOMBRES ===== */
        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .grid-numbers .btn-number {
            padding: 12px 0;
            background: #FAFBFC;
            border: 1.5px solid #E8EDF5;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #1A1A2E;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-numbers .btn-number:active {
            transform: scale(0.95);
        }

        .grid-numbers .btn-number.selected {
            background: #1A1A2E;
            border-color: #1A1A2E;
            color: #FFFFFF;
        }

        /* ===== RECHARGE BLOCK ===== */
        .recharge-block {
            background: #FAFBFC;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 8px;
            border-left: 3px solid #3074F9;
        }

        .recharge-block .recharge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .recharge-block .recharge-header h4 {
            font-size: 15px;
            font-weight: 700;
            color: #1A1A2E;
        }

        .recharge-block .recharge-header .status {
            font-size: 12px;
            color: #6B7A8F;
        }

        .recharge-block .recharge-header .status.done {
            color: #3074F9;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #6B7A8F;
            margin-bottom: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #E8EDF5;
            border-radius: 8px;
            font-size: 14px;
            color: #1A1A2E;
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #3074F9;
        }

        .form-group input::placeholder {
            color: #B0B8C8;
        }

        .consumption-display {
            font-size: 13px;
            color: #6B7A8F;
            margin-top: 8px;
            text-align: center;
            padding: 6px;
            background: #FFFFFF;
            border-radius: 6px;
        }

        .consumption-display .value {
            font-weight: 700;
            color: #1A1A2E;
        }

        .btn-validate-small {
            width: 100%;
            padding: 10px;
            background: #1A1A2E;
            border: none;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 8px;
        }

        .btn-validate-small:active {
            transform: scale(0.98);
        }

        .btn-validate-small:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== RÉSUMÉ ===== */
        .summary-box {
            background: #1A1A2E;
            border-radius: 12px;
            padding: 18px 20px;
            color: #FFFFFF;
            margin-top: 4px;
        }

        .summary-box .summary-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .summary-box .summary-title i {
            color: #3074F9;
            margin-right: 8px;
        }

        .summary-box .summary-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }

        .summary-box .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
        }

        .summary-box .summary-item:last-child {
            border-bottom: none;
        }

        .summary-box .summary-item .label {
            color: rgba(255, 255, 255, 0.5);
        }

        .summary-box .summary-item .val {
            font-weight: 600;
        }

        .summary-box .summary-item .val.highlight {
            color: #3074F9;
            font-size: 18px;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            background: #3074F9;
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        .btn-confirm:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px 20px;
            border-top: 1px solid #E8EDF5;
            color: #B0B8C8;
            font-size: 11px;
            flex-shrink: 0;
            background: #FFFFFF;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .header-dark {
                padding: 12px 16px;
            }
            .header-dark .logo h2 {
                font-size: 14px;
            }
            .scroll-area {
                padding: 16px 16px 12px 16px;
            }
            .recharge-block {
                padding: 12px;
            }
            .form-row {
                flex-direction: column;
                gap: 6px;
            }
            .grid-numbers .btn-number {
                padding: 10px 0;
                font-size: 14px;
            }
            .container {
                max-height: 85vh;
            }
        }

        @media (min-width: 768px) {
            .container {
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header-dark">
            <div class="logo">
                <span class="icon">⚡</span>
                <h2>Watt<span>Safe</span></h2>
            </div>
            <span class="step-label" id="stepLabel">Saisie des recharges</span>
        </div>

        <!-- ===== ZONE DE DÉFILEMENT ===== -->
        <div class="scroll-area" id="scrollArea">

            <!-- ===== INSTRUCTION ===== -->
            <div class="instruction">
                <i class="fas fa-info-circle"></i>
                <span>Saisissez vos recharges de la plus <strong>ANCIENNE</strong> à la plus <strong>RÉCENTE</strong></span>
            </div>

            <!-- ===== ÉTAPE 1 : NOMBRE DE RECHARGES ===== -->
            <div class="section" id="sectionCount">
                <div class="section-title">📋 De combien de recharges vous souvenez-vous ?</div>
                <div class="grid-numbers" id="numberGrid">
                    <button class="btn-number" data-value="1">1</button>
                    <button class="btn-number" data-value="2">2</button>
                    <button class="btn-number" data-value="3">3</button>
                    <button class="btn-number" data-value="4">4</button>
                    <button class="btn-number" data-value="5">5</button>
                    <button class="btn-number" data-value="6">6</button>
                    <button class="btn-number" data-value="7">7</button>
                    <button class="btn-number" data-value="8">8</button>
                    <button class="btn-number" data-value="9">9</button>
                    <button class="btn-number" data-value="10">10</button>
                </div>
            </div>

            <!-- ===== CONTENEUR POUR RECHARGES (AJOUT DYNAMIQUE) ===== -->
            <div id="rechargeContainer"></div>

            <!-- ===== CONTENEUR POUR RÉSUMÉ (AJOUT DYNAMIQUE) ===== -->
            <div id="summaryContainer"></div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            © 2026 WattSafe
        </div>

    </div>

    <script>
        // ============================================
        // ÉTAT
        // ============================================

        let totalRecharges = 0;
        let currentIndex = 0;
        let rechargesData = [];
        let isComplete = false;

        // ============================================
        // RÉFÉRENCES
        // ============================================

        const numberGrid = document.getElementById('numberGrid');
        const rechargeContainer = document.getElementById('rechargeContainer');
        const summaryContainer = document.getElementById('summaryContainer');
        const scrollArea = document.getElementById('scrollArea');
        const stepLabel = document.getElementById('stepLabel');

        // ============================================
        // 1. CHOIX DU NOMBRE
        // ============================================

        numberGrid.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-number');
            if (!btn) return;

            numberGrid.querySelectorAll('.btn-number').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            totalRecharges = parseInt(btn.dataset.value);
            currentIndex = 0;
            rechargesData = [];

            // Ajouter la première recharge
            addRechargeSection(0);
            stepLabel.textContent = `Recharge 1/${totalRecharges}`;

            // Scroll vers le bas
            setTimeout(() => {
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 100);
        });

        // ============================================
        // 2. AJOUTER UNE SECTION RECHARGE
        // ============================================

        function addRechargeSection(index) {
            const num = index + 1;
            const isLast = (index === totalRecharges - 1);

            const div = document.createElement('div');
            div.className = 'section recharge-block';
            div.id = `recharge-${index}`;
            div.style.borderLeft = '3px solid #3074F9';

            div.innerHTML = `
                <div class="recharge-header">
                    <h4>💰 Recharge ${num}/${totalRecharges}</h4>
                    <span class="status" id="status-${index}">⬜ À remplir</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Montant (FCFA)</label>
                        <input type="number" class="montant-input" id="montant-${index}" placeholder="Ex: 5000" min="1">
                    </div>
                    <div class="form-group">
                        <label>Durée (jours)</label>
                        <input type="number" class="duree-input" id="duree-${index}" placeholder="Ex: 15" min="1">
                    </div>
                </div>
                <div class="consumption-display" id="conso-${index}">
                    📊 Consommation : <span class="value">--</span> FCFA/jour
                </div>
                <button class="btn-validate-small" id="validate-${index}">Valider cette recharge</button>
            `;

            rechargeContainer.appendChild(div);

            // Écouteurs
            const montantInput = document.getElementById(`montant-${index}`);
            const dureeInput = document.getElementById(`duree-${index}`);
            const consoDisplay = document.getElementById(`conso-${index}`).querySelector('.value');
            const status = document.getElementById(`status-${index}`);
            const btnValidate = document.getElementById(`validate-${index}`);

            // Désactiver le bouton par défaut
            btnValidate.disabled = true;

            function updateRecharge() {
                const montant = parseFloat(montantInput.value);
                const duree = parseFloat(dureeInput.value);

                if (montant && duree && duree > 0) {
                    const conso = montant / duree;
                    consoDisplay.textContent = conso.toFixed(0);
                    btnValidate.disabled = false;
                } else {
                    consoDisplay.textContent = '--';
                    btnValidate.disabled = true;
                }
            }

            montantInput.addEventListener('input', updateRecharge);
            dureeInput.addEventListener('input', updateRecharge);

            // Validation de la recharge
            btnValidate.addEventListener('click', function() {
                const montant = parseFloat(montantInput.value);
                const duree = parseFloat(dureeInput.value);

                if (!montant || !duree || duree <= 0) {
                    alert('Veuillez remplir tous les champs.');
                    return;
                }

                // Sauvegarder
                rechargesData[index] = { montant, duree };

                // Marquer comme validée
                status.textContent = '✅ Validée';
                status.className = 'status done';
                div.style.borderLeft = '3px solid #00C853';
                btnValidate.disabled = true;
                montantInput.disabled = true;
                dureeInput.disabled = true;

                // Si c'est la dernière, afficher le résumé
                if (index === totalRecharges - 1) {
                    setTimeout(() => {
                        addSummarySection();
                        stepLabel.textContent = 'Terminé 🎉';
                    }, 300);
                } else {
                    // Ajouter la recharge suivante
                    const nextIndex = index + 1;
                    setTimeout(() => {
                        addRechargeSection(nextIndex);
                        stepLabel.textContent = `Recharge ${nextIndex+1}/${totalRecharges}`;
                        scrollArea.scrollTop = scrollArea.scrollHeight;
                    }, 300);
                }
            });
        }

        // ============================================
        // 3. AJOUTER LE RÉSUMÉ
        // ============================================

        function addSummarySection() {
            // Calcul de la moyenne pondérée
            let sommeScores = 0;
            let sommeConsoScore = 0;

            rechargesData.forEach((r, i) => {
                const conso = r.montant / r.duree;
                const score = r.duree * (i + 1);
                sommeConsoScore += conso * score;
                sommeScores += score;
            });

            const moyenne = sommeConsoScore / sommeScores;

            const div = document.createElement('div');
            div.className = 'section';
            div.innerHTML = `
                <div class="summary-box">
                    <div class="summary-title">
                        <i class="fas fa-calculator"></i> Récapitulatif
                    </div>
                    <div class="summary-sub">Moyenne pondérée calculée</div>
                    <div id="summaryItems"></div>
                    <div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08);">
                        <div style="display:flex; justify-content:space-between; font-size:15px;">
                            <span style="color:rgba(255,255,255,0.5);">Consommation moyenne</span>
                            <span style="font-weight:700; color:#3074F9; font-size:20px;">${moyenne.toFixed(0)} FCFA/jour</span>
                        </div>
                    </div>
                </div>
                <button class="btn-confirm" id="btnConfirm">
                    <i class="fas fa-check-circle"></i> Confirmer et continuer
                </button>
            `;

            summaryContainer.appendChild(div);

            // Remplir les détails des recharges
            const summaryItems = div.querySelector('#summaryItems');
            rechargesData.forEach((r, i) => {
                const item = document.createElement('div');
                item.className = 'summary-item';
                item.innerHTML = `
                    <span class="label">Recharge ${i+1}</span>
                    <span class="val">${r.montant} FCFA · ${r.duree}j</span>
                `;
                summaryItems.appendChild(item);
            });

            // Bouton Confirmer
            document.getElementById('btnConfirm').addEventListener('click', function() {
                // Sauvegarder
                localStorage.setItem('wattSafeRecharges', JSON.stringify(rechargesData));
                localStorage.setItem('wattSafeRechargeCount', totalRecharges);

                // Rediriger
                window.location.href = 'config-alerte.html';
            });

            // Scroll vers le résumé
            setTimeout(() => {
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 200);
        }

        // ============================================
        // 4. VÉRIFICATION CONNEXION
        // ============================================

        const savedUser = localStorage.getItem('wattSafeUser');
        if (!savedUser) {
            window.location.href = 'login.html';
        }

        console.log('⚡ Page de saisie progressive (ajout en bas)');
    </script>

</body>
</html>
